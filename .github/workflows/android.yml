name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: APK derle
        run: flutter build apk --release --split-per-abi

      - name: APK dosyalarını adlandır
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/kalori-takip-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/kalori-takip-eski-telefonlar.apk

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Kalori Takip (derleme ${{ github.run_number }})
          make_latest: true
          body: |
            Telefonunuza **kalori-takip-arm64.apk** dosyasını indirip kurun
            (2017 ve sonrası telefonların neredeyse tamamı).
            Kurulmazsa **kalori-takip-eski-telefonlar.apk** dosyasını deneyin.
          files: out/*.apk
